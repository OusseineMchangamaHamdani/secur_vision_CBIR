services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres16_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./iniDB.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vectorDB_network

  app:
    build: .
    image: pgvector_app:latest
    container_name: python_app
    restart: always
    depends_on:
      - db
    networks:
      - vectorDB_network

volumes:
  pgdata:
networks:
  vectorDB_network:
